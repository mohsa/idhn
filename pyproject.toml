[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idhn"
version = "0.3.0"
description = "Interchangeable Deterministic Host Network -- a policy boundary between coding agents and the resources they touch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
idhn = "idhn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["idhn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "docker" tests spin up the real compose topology (build + start
# multiple containers, real network egress to example.com/wikipedia.org)
# -- excluded from the default run so `pytest`/`pytest -q` stays fast and
# Docker-independent, the same way it's always been. Run them explicitly:
# pytest -m docker tests/integration
markers = ["docker: requires Docker and real network access; excluded by default, see tests/integration/"]
addopts = "-m 'not docker'"
