# IDHN's disposable two-container topology:
#
#   agent (Codex)  --[internal network, no internet]-->  gateway
#   gateway         --[internal + external networks]-->  internet
#
# The agent container never joins the `external` network, so it has no
# route to the internet other than through the gateway's policy-checked
# forward proxy. Build context is the repo root so both Dockerfiles can
# COPY the `idhn` package.

networks:
  internal:
    internal: true
  external: {}

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    networks:
      internal:
      external:
    volumes:
      - ../policies:/policies:ro
      - ${IDHN_RUN_DIR:-./runs/local}:/run
    environment:
      IDHN_MANIFEST_PATH: /policies/${IDHN_POLICY_FILE:-examples/coding-safe.yaml}
      IDHN_RUN_DIR: /run
      IDHN_RUN_ID: ${IDHN_RUN_ID:-local}
      IDHN_TASK_ID: ${IDHN_TASK_ID:-unknown-task}
      IDHN_AGENT: ${IDHN_AGENT:-codex}
      IDHN_AGENT_HOSTNAME: "agent"
      IDHN_GATEWAY_PORT: "8080"

  # Deliberately dangerous internal service for the M2 transitive-escape
  # experiment (lab/services/fetch-service). It has no direct internet
  # route either -- its own outbound fetches go through the same gateway,
  # which is what lets IDHN tell "agent -> fetch-service" apart from
  # "fetch-service -> the internet" and police them differently.
  fetch-service:
    build:
      context: ..
      dockerfile: lab/services/fetch-service/Dockerfile
    networks:
      internal:
    depends_on:
      - gateway
    environment:
      HTTP_PROXY: http://gateway:8080
      HTTPS_PROXY: http://gateway:8080
      NO_PROXY: localhost,127.0.0.1
      PORT: "9000"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  # Controlled receiver for the M4 containment experiment
  # (lab/services/exfil-sink). It has no direct internet route either --
  # not that it needs one, it only receives. Whether the agent can reach
  # it at all is governed by the same gateway network.allow/.deny as any
  # other target; it never appears in the policy engine's own logic, only
  # as an ordinary hostname a manifest can allow or deny.
  exfil-sink:
    build:
      context: ..
      dockerfile: lab/services/exfil-sink/Dockerfile
    networks:
      internal:
    volumes:
      - ${IDHN_RUN_DIR:-./runs/local}:/run
    environment:
      PORT: "9100"
      IDHN_CANARY_VALUE: ${IDHN_CANARY_VALUE:-}
      SINK_LOG_PATH: /run/exfil-sink-received.jsonl
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    networks:
      internal:
    depends_on:
      - gateway
      - fetch-service
      - exfil-sink
    volumes:
      - ../lab/repos/toy-app:/workspace
      # Codex's ChatGPT-account credentials, mounted read-only as a single
      # file -- never the whole host ~/.codex or home directory. Requires
      # `codex login` (or `codex login --device-auth`) to have been run on
      # the host first. See README.md's "Codex authentication" section.
      - ${IDHN_CODEX_AUTH_PATH}:/home/agent/.codex/auth.json:ro
      # Same run directory the gateway writes events.jsonl to -- the agent
      # writes codex's own --json stream and before/after test logs here
      # (see idhn/runtime/docker.py) so `idhn m3-report` can read them all
      # from one place afterward.
      - ${IDHN_RUN_DIR:-./runs/local}:/run
    environment:
      HTTP_PROXY: http://gateway:8080
      HTTPS_PROXY: http://gateway:8080
      NO_PROXY: localhost,127.0.0.1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IDHN_TASK: ${IDHN_TASK:-}
      IDHN_AGENT_COMMAND: ${IDHN_AGENT_COMMAND:-}
      IDHN_ALLOWED_BINARIES: ${IDHN_ALLOWED_BINARIES:-}
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${IDHN_MEMORY:-4g}
    cpus: ${IDHN_CPU:-2}
