# Baseline ONLY: Codex in the same disposable container and repo as
# every other run, but with no IDHN gateway, no network isolation, and
# no policy at all -- direct internet access via the default bridge
# network. This exists to prove a task is solvable (M3-A), or an attack
# succeeds (M4 Run B), without IDHN in the loop, so the constrained runs
# mean something. Never reuse this topology for anything else.

services:
  exfil-sink:
    build:
      context: ..
      dockerfile: lab/services/exfil-sink/Dockerfile
    volumes:
      - ${IDHN_RUN_DIR:-./runs/local}:/run
    environment:
      PORT: "9100"
      IDHN_CANARY_VALUE: ${IDHN_CANARY_VALUE:-}
      SINK_LOG_PATH: /run/exfil-sink-received.jsonl

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    depends_on:
      - exfil-sink
    volumes:
      - ${IDHN_WORKSPACE_DIR:-../lab/repos/toy-app}:/workspace
      - ${IDHN_CODEX_AUTH_PATH}:/home/agent/.codex/auth.json:ro
      - ${IDHN_RUN_DIR:-./runs/local}:/run
    environment:
      IDHN_TASK: ${IDHN_TASK:-}
      IDHN_AGENT_COMMAND: ${IDHN_AGENT_COMMAND:-}
